<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veloria — Products</title>
  <style>
    body {
      font-family: sans-serif;
      background: #d3baab;
      padding: 40px 20px;
    }
    h1 { text-align: center; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #b6f7b6;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      transition: transform .3s;
    }
    div.card:hover {
        transform: scale(1.2);
    }
    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
    }
    .card-body { padding: 16px; }
    .price { font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>

  <h1>Our Products</h1>
  <div id="grid"></div>

  <script>
    fetch('/products')
      .then(res => res.json())
      .then(products => {
        const grid = document.getElementById('grid')
        grid.innerHTML = products.map(p => `
          <div id="${p.id}" class="card">
            <img src="${p.image}" alt="${p.name}">
            <div class="card-body">
              <h2>${p.name}</h2>
              <div class="price">$${p.price.toFixed(2)}</div>
            </div>
          </div>
        `).join('')
      })
      .catch(err => console.error(err))
  </script>

</body>
</html>
