    <h1 id = 'site-name'> Welcome to VeloRIA </h1>


    <button id="to-contact-page"> contact </button>
    <button id="to-about-page"> about </button> 
    <button id="to-product-page"> products </button>

    <script>
        const contactButton = document.querySelector('#to-contact-page')
        const aboutButton = document.querySelector('#to-about-page')
        const productButton = document.querySelector('#to-product-page')

        contactButton.addEventListener('click', () => {
            window.location.href = 'http://localhost:3000/contact'
        })

        aboutButton.addEventListener('click', () => {
            window.location.href = 'http://localhost:3000/about'
        })

        productButton.addEventListener('click', () => {
            window.location.href = 'products.html'
        })
    </script>
